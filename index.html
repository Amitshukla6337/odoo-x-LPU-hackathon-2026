<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense - Inventory Management System</title>
    <meta name="description" content="StockSense - Real-time inventory management: receipts, deliveries, transfers, adjustments.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">

        <div class="logo">
            📦 <span>StockSense</span>
        </div>

        <!-- Backend status indicator -->
        <div id="api-status" style="
            margin: 0 10px 16px;
            padding: 7px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            background: #1d2939;
            color: #667085;
            display: flex;
            align-items: center;
            gap: 6px;
        ">
            <span id="api-dot">⚪</span>
            <span id="api-text">Connecting...</span>
        </div>

        <button onclick="showPage('dashboard')" id="nav-dashboard">
            🏠 Dashboard
        </button>

        <button onclick="showPage('products')" id="nav-products">
            📦 Products
        </button>

        <button onclick="showPage('receipts')" id="nav-receipts">
            📥 Receipts
        </button>

        <button onclick="showPage('deliveries')" id="nav-deliveries">
            📤 Deliveries
        </button>

        <button onclick="showPage('transfers')" id="nav-transfers">
            🔄 Internal Transfers
        </button>

        <button onclick="showPage('adjustments')" id="nav-adjustments">
            ⚖️ Adjustments
        </button>

        <button onclick="showPage('history')" id="nav-history">
            📜 Move History
        </button>

        <button onclick="showPage('warehouse')" id="nav-warehouse">
            🏭 Warehouse
        </button>

        <button onclick="showPage('profile')" id="nav-profile">
            👤 Profile
        </button>

    </aside>


    <!-- Main Application -->
    <main class="main">

        <!-- Header -->
        <header>

            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p>Inventory Management System</p>
            </div>

            <input
                type="text"
                id="search"
                placeholder="Search products or SKU..."
                onkeyup="globalSearch()"
                aria-label="Search products"
            >

        </header>


        <!-- Dynamic Page Content -->
        <section id="content"></section>

    </main>

</div>


<!-- Modal -->
<div id="modal" class="modal">

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal()"
            aria-label="Close"
        >
            &times;
        </span>

        <div id="modalContent"></div>

    </div>

</div>


<!-- Application JavaScript -->
<script src="app.js"></script>

</body>
</html>
