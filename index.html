```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockSense - Inventory Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">

        <div class="logo">
            📦 <span>StockSense</span>
        </div>

        <button onclick="showPage('dashboard')">
            🏠 Dashboard
        </button>

        <button onclick="showPage('products')">
            📦 Products
        </button>

        <button onclick="showPage('receipts')">
            📥 Receipts
        </button>

        <button onclick="showPage('deliveries')">
            📤 Deliveries
        </button>

        <button onclick="showPage('transfers')">
            🔄 Internal Transfers
        </button>

        <button onclick="showPage('adjustments')">
            ⚖️ Adjustments
        </button>

        <button onclick="showPage('history')">
            📜 Move History
        </button>

        <button onclick="showPage('warehouse')">
            🏭 Warehouse
        </button>

        <button onclick="showPage('profile')">
            👤 Profile
        </button>

    </aside>


    <!-- Main Application -->
    <main class="main">

        <!-- Header -->
        <header>

            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p>Inventory Management System</p>
            </div>

            <input
                type="text"
                id="search"
                placeholder="Search products or SKU..."
                onkeyup="globalSearch()"
                aria-label="Search products"
            >

        </header>


        <!-- Dynamic Page Content -->
        <section id="content"></section>
        

    </main>

</div>


<!-- Modal -->
<div id="modal" class="modal">

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal()"
            aria-label="Close"
        >
            ×
        </span>

        <div id="modalContent"></div>

    </div>

</div>


<!-- Application JavaScript -->
<script src="app.js"></script>

</body>
</html>
